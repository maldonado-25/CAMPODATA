name: Compilar APK CampoData

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias del sistema
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git libncurses5:i386 libstdc++6:i386 \
          libgtk2.0-0:i386 libusb-1.0-0:i386 zlib1g-dev libssl-dev \
          autoconf libtool libffi-dev unzip openjdk-17-jdk

    - name: Instalar herramientas de compilacion
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools wheel
        pip install cython==0.29.33
        pip install buildozer sh

    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Guardar APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-campodata-debug
        path: bin/*.apk